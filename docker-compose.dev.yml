# MariaDB 11.8 para DESARROLLO LOCAL. Produccion tiene su propia orquestacion, aparte.
# El motor es MariaDB (11.8.8 en produccion), NO MySQL: se replica en local para paridad.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # conserva los datos
#   docker compose -f docker-compose.dev.yml down -v     # borra tambien los datos
#
# LAS CLAVES NO ESTAN AQUI: salen del `.env` local del proyecto (sin versionar), que compose lee solo
# para sustituir variables. El repositorio es publico y no lleva contraseñas, ni de desarrollo. Si
# faltan, compose se para y dice cual (`:?`). Las dos que hacen falta (ver .env.example):
#   DEV_MARIADB_ROOT_PASSWORD=...   DEV_MARIADB_PASSWORD=...
# OJO: MariaDB solo las aplica al CREAR el volumen. Con un volumen que ya existe, las claves son las
# que tenia: pon en el .env las de tu volumen (o `down -v` para empezar de cero, perdiendo los datos).
#
# CHARSET: utf8mb4 / utf8mb4_unicode_ci, forzado a nivel de SERVIDOR para que la
# base de datos que crea el entrypoint (MARIADB_DATABASE) los herede. No es un
# detalle estetico: nombres de usuario, titulos de video y categorias llevan
# emoji (🎭 Humor, 🏋️ Fitness). Con utf8mb3 o latin1 se corrompen o revientan
# las inserciones. MariaDB tiene particularidades propias en collations: se
# verifica empiricamente, no se asume.

services:
  mariadb:
    image: mariadb:11.8
    container_name: dareflash-mariadb-dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_MARIADB_ROOT_PASSWORD:?Falta DEV_MARIADB_ROOT_PASSWORD en el .env local (ver .env.example)}
      MARIADB_DATABASE: dareflash
      MARIADB_USER: dareflash
      MARIADB_PASSWORD: ${DEV_MARIADB_PASSWORD:?Falta DEV_MARIADB_PASSWORD en el .env local (ver .env.example)}
    ports:
      # Puerto 3307 en el HOST (dentro del contenedor sigue siendo 3306).
      # El 3306 del host lo ocupa otra instalacion de MySQL de la maquina
      # (servicio `doliwampmysqld`, de otro proyecto). No se toca: convivimos.
      # Solo en localhost: no exponer la base de datos a la red local.
      - "127.0.0.1:3307:3306"
    volumes:
      - dareflash_mariadb_data:/var/lib/mysql
    healthcheck:
      # Script oficial de la imagen mariadb.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  dareflash_mariadb_data:
