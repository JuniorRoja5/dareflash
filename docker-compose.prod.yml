# DareFlash — orquestacion de PRODUCCION.
#
# El .env vive FUERA del repo, en el entorno del servidor. Contiene tanto MARIADB_*
# (para el servicio de BD) como las variables de la app (DATABASE_URL apuntando al
# host `mariadb`, APP_URL, AUTH_SECRET, CRON_SECRET, SMTP_*, etc.). Ningun secreto
# vive en el repositorio.
#
#   Desplegar:  git pull && ./scripts/deploy.sh        (volver atras: ./scripts/deploy.sh <sha>)
#   Logs:       docker compose -f docker-compose.prod.yml logs -f web
#
# LAS IMAGENES NO SE CONSTRUYEN AQUI. Las construye CI (.github/workflows/imagenes.yml) y las publica
# en ghcr.io con el SHA del commit; deploy.sh las descarga y las etiqueta en local como `desplegada`.
# Por eso `web`, `worker`, `migrate` y `geoip` usan `${IMAGE_TAG:-desplegada}`: cualquier comando de este
# compose sin IMAGE_TAG (logs, un `up -d` a mano, el cron de geoip) usa LO DESPLEGADO, y no lo ultimo
# que haya en el registro. Construir en el servidor queda como plan de EMERGENCIA, con
# docker-compose.construir.yml (ver ahi y en deploy.sh --construir-aqui).
#
# Solo `caddy` publica puertos al exterior (80/443). mariadb y redis NO se exponen.

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    # Techo de RECURSOS (la maquina: 1 vCPU, ~4 GB). Claves NO-swarm que `docker compose up` respeta
    # (mem_limit/mem_reservation/cpu_shares); NO `deploy.resources` (solo swarm). Son un TECHO DE
    # SEGURIDAD contra desmadres, holgado (~2-3x del pico normal), no un presupuesto ajustado: si un
    # servicio fuera justo con su techo, el techo esta mal (subirlo). `cpu_shares` es PESO relativo
    # bajo contencion (no un cap duro: en 1 nucleo estrangularia sin necesidad). MariaDB = prioridad
    # alta y el techo mas alto (degradarla por debajo de su uso seria lo peor); solo el techo del
    # contenedor, su config interna (buffer pool, etc.) NO se toca aqui.
    mem_limit: 1500m
    mem_reservation: 512m
    cpu_shares: 1024
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - ${HOME}/dareflash-config/.env # MARIADB_ROOT_PASSWORD, MARIADB_DATABASE, MARIADB_USER, MARIADB_PASSWORD
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # Script oficial de la imagen mariadb: conecta y comprueba que InnoDB arranco.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Aun NO lo usa el codigo (limpieza posterior); se deja montado.
    networks:
      - internal

  web:
    # Etapa `runner` del Dockerfile (la construye CI; en emergencia, docker-compose.construir.yml).
    image: ghcr.io/juniorroja5/dareflash-web:${IMAGE_TAG:-desplegada}
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 256m
    cpu_shares: 1024 # prioridad alta (sirve las peticiones)
    env_file:
      - ${HOME}/dareflash-config/.env # DATABASE_URL (host `mariadb`, puerto 3306), APP_URL, AUTH_SECRET, ...
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "3000" # solo dentro de la red interna; Caddy hace de proxy
    volumes:
      # Avatares: la app (env.AVATARS_DIR=/srv/avatars) ESCRIBE aqui; Caddy lo sirve en /avatars/*
      # (mismo volumen, montado abajo en `caddy` en solo-lectura). Volumen nombrado -> persiste.
      - avatars_data:/srv/avatars
      # Portadas de reto (env.PORTADAS_DIR=/srv/portadas): mismo patron que los avatares.
      - portadas_data:/srv/portadas
      # Fichero de IP (Fase 9 · P5, env.GEOIP_FICHERO): la app solo LEE; lo escribe el servicio `geoip`
      # (scripts/actualizar-geoip.sh, cron mensual) con un rename atomico, y la app lo reabre sola. Sin
      # fichero no se rompe nada: la ubicacion queda "desconocida" y el worker avisa al admin.
      - geoip_data:/srv/geoip:ro
    networks:
      - internal

  # --- migrate / tools: imagen de HERRAMIENTAS (one-off) ---
  # Usa la etapa `builder` (tiene el esquema, el CLI de Prisma, tsx y el codigo
  # fuente que la imagen standalone NO lleva) y corre como root (sin el EACCES del
  # usuario no-root en /app/.npm). El perfil `tools` evita que arranque con `up -d`;
  # solo se ejecuta puntualmente con `run --rm`.
  #
  #   Migrar:       lo hace deploy.sh (con la imagen del SHA que despliega). A mano:
  #                 IMAGE_TAG=<sha> ./scripts/migrate-prod.sh  (compara las migraciones de la imagen con
  #                 las de ese commit antes de aplicar: el "No pending" FALSO de agosto de 2026 era una
  #                 imagen vieja, y con imagenes etiquetadas por SHA esa comparacion lo caza)
  #   Crear admin:  ver scripts/create-admin.ts (necesita ADMIN_EMAIL y ADMIN_PASSWORD).
  migrate:
    # Etapa `builder` del Dockerfile.
    image: ghcr.io/juniorroja5/dareflash-migrate:${IMAGE_TAG:-desplegada}
    profiles: ["tools"]
    env_file:
      - ${HOME}/dareflash-config/.env
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks:
      - internal

  # --- worker: procesa la cola de trabajos (Job) de forma permanente ---
  # Fuente de verdad = MariaDB (tabla Job); el worker sondea y despacha. Sin Redis (con la
  # tabla basta; el despertador se anadira solo si una necesidad medida lo justifica). Su
  # consecuencia hoy: los correos de verificacion (SEND_EMAIL) SALEN.
  #
  # `stop_grace_period`: ante SIGTERM el worker deja de reclamar y, entre trabajos, LIBERA a
  # PENDING los no procesados. El peor caso de apagado es UN job en vuelo = JOB_TIMEOUT_MS (60 s)
  # + desconexion; NO lote x timeout (por eso se comprueba parar() entre trabajos). 90 s cubre
  # ese peor caso con margen. Si se sube JOB_TIMEOUT_MS, subir tambien esto.
  worker:
    # Etapa `worker` del Dockerfile.
    image: ghcr.io/juniorroja5/dareflash-worker:${IMAGE_TAG:-desplegada}
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 128m
    cpu_shares: 512 # trabajo de FONDO: menos peso que web/mariadb bajo contencion
    env_file:
      - ${HOME}/dareflash-config/.env # DATABASE_URL, SMTP_*, EMAIL_FROM, APP_URL, AUTH_SECRET...
    environment:
      # La MISMA ruta que el montaje de abajo, fijada aqui y no heredada del .env: si las dos
      # discreparan, el barrido miraria un directorio vacio. Es la ruta que usa `web`.
      PORTADAS_DIR: /srv/portadas
      # Igual que PORTADAS_DIR: la ruta del montaje de abajo, fijada aqui (el aviso de caducidad del
      # fichero de IP mira la fecha de ESTE fichero; si la ruta discrepara, avisaria de que no existe).
      GEOIP_FICHERO: /srv/geoip/dbip-city-lite.mmdb
    depends_on:
      mariadb:
        condition: service_healthy
    stop_grace_period: 90s
    volumes:
      # Portadas de reto, en LECTURA-ESCRITURA (Fase 9 · P3): el barrido horario del worker BORRA el
      # logo de las propuestas de reto rechazadas o caducadas (`limpiarLogosDescartados`). Sin este
      # montaje no veia el directorio y, a proposito, no tocaba nada: los logos caducados se quedaban
      # en el volumen para siempre. El worker corre como root (etapa `builder`), asi que puede borrar
      # ficheros que escribio `web` (nextjs, uid 1001) sin EACCES.
      - portadas_data:/srv/portadas
      # Fichero de IP, SOLO LECTURA: el worker no lo abre (pesa ~127 MB en memoria), solo mira su fecha
      # para el aviso de caducidad (GEOIP_DIAS_CADUCA).
      - geoip_data:/srv/geoip:ro
    networks:
      - internal

  # --- geoip: ACTUALIZA el fichero de IP (one-off, Fase 9 · P5) ---
  # El UNICO servicio que monta geoip_data en ESCRITURA; web y worker lo montan en solo lectura. Lleva
  # dentro lo que necesita el guion (curl, gunzip, node, maxmind): el host no instala nada ni necesita
  # saber donde vive el volumen. El perfil `geoip` evita que arranque con `up -d`.
  #
  #   Uso (y linea del cron mensual):  docker compose -f docker-compose.prod.yml run --rm geoip
  #   (sin `--build`: la imagen es la `desplegada`, que deploy.sh renueva con cada despliegue; asi el
  #    cron nunca usa la imagen del primer dia ni construye nada. Una linea vieja con `--build` sigue
  #    funcionando: sin seccion `build`, compose no tiene nada que construir.)
  #
  # Si algo falla NO toca el fichero vivo y sale con codigo distinto de cero; el registro queda en
  # /srv/geoip/actualizar-geoip.log, dentro del volumen.
  geoip:
    # Etapa `geoip` del Dockerfile.
    image: ghcr.io/juniorroja5/dareflash-geoip:${IMAGE_TAG:-desplegada}
    profiles: ["geoip"]
    restart: "no"
    environment:
      GEOIP_FICHERO: /srv/geoip/dbip-city-lite.mmdb
    volumes:
      - geoip_data:/srv/geoip
    # Sin `networks`: no habla con ningun servicio, solo descarga de DB-IP (red por defecto).

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 32m
    cpu_shares: 512
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Se monta el DIRECTORIO caddy/, no el fichero suelto. Un bind-mount de un
      # fichero ata el contenedor al INODO: `git pull` no edita en su sitio (escribe un
      # temporal y lo renombra encima), asi que el inodo cambia y el contenedor se queda
      # con el contenido VIEJO hasta recrearlo -> `caddy reload` recargaba el Caddyfile
      # antiguo sin error. Montando el directorio (su inodo no cambia con pull), el
      # contenido se ve siempre al dia y basta `caddy reload`. NO revertir a fichero suelto.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data # certificados (persistente)
      - caddy_config:/config
      # Avatares: MISMO volumen que escribe `web`, aqui en SOLO-LECTURA. Caddy los sirve como
      # estaticos en /avatars/* (ver Caddyfile), fuera de la app.
      - avatars_data:/srv/avatars:ro
      # Portadas de reto: igual, servidas en /portadas/* (ver Caddyfile).
      - portadas_data:/srv/portadas:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  mariadb_data:
  redis_data:
  caddy_data:
  caddy_config:
  avatars_data: # avatares subidos (WebP); escrito por `web`, servido por `caddy`
  portadas_data: # portadas de reto (WebP); escrito por `web`, servido por `caddy`, limpiado por `worker`
  geoip_data: # fichero de IP (DB-IP Lite City); escrito por el servicio `geoip`, leido por `web` y `worker`

networks:
  internal:
